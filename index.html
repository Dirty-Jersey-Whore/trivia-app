<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Circuses - Test Your Knowledge!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .homepage-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .hero p {
            font-size: 1.4em;
            opacity: 0.95;
        }

        .content {
            padding: 50px 40px;
        }

        .section-title {
            text-align: center;
            color: #2c3e50;
            font-size: 2.2em;
            margin-bottom: 30px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .category-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .category-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .category-card .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .category-card h3 {
            color: #2c3e50;
            font-size: 1.6em;
            margin-bottom: 10px;
        }

        .category-card p {
            color: #7f8c8d;
            font-size: 1em;
        }

        .lucky-section {
            text-align: center;
            margin-top: 50px;
            padding: 40px;
            background: linear-gradient(135deg, #fff9e6 0%, #ffe9b3 100%);
            border-radius: 15px;
        }

        .lucky-section h2 {
            color: #f39c12;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .lucky-btn {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5em;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(243, 156, 18, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .lucky-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(243, 156, 18, 0.6);
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2.5em;
            }
            
            .category-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="homepage-container">
        <div class="hero">
            <h1>🎪 Trivia Circuses</h1>
            <p>Step right up and test your knowledge!</p>
        </div>

        <div class="content">
            <h2 class="section-title">Choose Your Challenge</h2>
            
            <div class="category-grid">
                <a href="game.html" class="category-card">
                    <div class="icon">🏛️</div>
                    <h3>State Capitals</h3>
                    <p>Test your U.S. geography knowledge</p>
                </a>

                <a href="#" class="category-card" onclick="alert('Coming Soon!'); return false;">
                    <div class="icon">🌍</div>
                    <h3>World Geography</h3>
                    <p>Coming Soon!</p>
                </a>

                <a href="#" class="category-card" onclick="alert('Coming Soon!'); return false;">
                    <div class="icon">📚</div>
                    <h3>History</h3>
                    <p>Coming Soon!</p>
                </a>

                <a href="#" class="category-card" onclick="alert('Coming Soon!'); return false;">
                    <div class="icon">🔬</div>
                    <h3>Science</h3>
                    <p>Coming Soon!</p>
                </a>
            </div>

            <div class="lucky-section">
                <h2>Feeling Lucky?</h2>
                <a href="game.html" class="lucky-btn">🎲 Random Quiz!</a>
            </div>
        </div>
    </div>
</body>
</html>
